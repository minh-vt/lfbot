[platformio]
default_envs = sim

; --- MÔ PHỎNG 2D NATIVE (RAYLIB) TRÊN DESKTOP ---
[env:sim]
platform = native
build_flags = 
    -std=c++17
    -O3
    -Wall
    -Wextra
    -Wpedantic
    -DPLATFORM_DESKTOP
    -I lib
    -I src/sim
    -lraylib -lGL -lm -lpthread -ldl -lrt -lX11
build_src_filter = -<*> +<sim/*.cpp> +<../lib/drive/*.cpp>

; --- KIỂM THỬ KHÔNG ĐỒ HỌA (HEADLESS SMOKE TEST) ---
[env:test_core]
platform = native
build_flags = 
    -std=c++17
    -O3
    -Wall
    -Wextra
    -Wpedantic
    -DPLATFORM_DESKTOP
    -I lib
    -I test
    -I src/esp32
build_src_filter = -<*> +<../test/test_drive.cpp> +<../lib/drive/*.cpp>

; --- KIỂM THỬ MÔ PHỎNG HEADLESS TỰ ĐỘNG (FULL TRACK SIMULATION) ---
[env:sim_test]
platform = native
build_flags = 
    -std=c++17
    -O3
    -Wall
    -Wextra
    -Wpedantic
    -DPLATFORM_DESKTOP
    -I lib
    -I src/sim
    -lraylib -lGL -lm -lpthread -ldl -lrt -lX11
build_src_filter = -<*> +<../test/test_sim.cpp> +<sim/*.cpp> -<sim/main.cpp> +<../lib/drive/*.cpp>

; --- KIỂM THỬ NÉ VẬT CẢN HEADLESS (gạch trên đường chạy) ---
[env:sim_avoid]
platform = native
build_flags = 
    -std=c++17
    -O3
    -Wall
    -Wextra
    -Wpedantic
    -DPLATFORM_DESKTOP
    -I lib
    -I src/sim
    -lraylib -lGL -lm -lpthread -ldl -lrt -lX11
build_src_filter = -<*> +<../test/test_avoidance.cpp> +<sim/*.cpp> -<sim/main.cpp> +<../lib/drive/*.cpp>

; --- DATABASE BIÊN DỊCH CHO CLANG-TIDY (gộp mọi include path) ---
[env:lint]
platform = native
build_flags = 
    -std=c++17
    -O3
    -Wall
    -Wextra
    -Wpedantic
    -DPLATFORM_DESKTOP
    -I lib
    -I src/sim
    -I src/esp32
    -I test
build_src_filter = -<*> +<sim/*.cpp> +<../lib/drive/*.cpp> +<../test/*.cpp>

; --- FIRMWARE NẠP THẬT XUỐNG ESP32-S3 QUA USB ---
[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags = 
    -std=gnu++17
    -O3
    -DPLATFORM_ESP32
    -I lib
    -I src/esp32
build_src_filter = -<*> +<esp32/*.cpp> +<../lib/drive/*.cpp>
; Lint riêng cho firmware nhúng (IDF không parse được bằng clang-tidy host).
check_tool = cppcheck
check_src_filters =
    +<src/esp32/*.cpp>
check_flags =
    cppcheck: --enable=warning,performance,portability --inline-suppr
check_skip_packages = yes
