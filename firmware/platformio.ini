[platformio]
default_envs = sim

[native]
platform = native
lib_ldf_mode = off
lib_ignore = robot
build_flags = -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror -I lib/robot -I src/sim

[png]
build_flags =
    ${native.build_flags}
    !pkg-config --cflags --libs libpng | sed 's/-I/-isystem /g'

[core]
sources =
    +<../lib/robot/drive.cpp>
    +<../lib/robot/robot.cpp>
    +<../lib/robot/race.cpp>
    +<../lib/robot/route.cpp>

[engine]
sources =
    +<sim/simulation.cpp>
    +<sim/track_asset.cpp>
    +<sim/referee.cpp>
    +<sim/world_physics.cpp>

[trial]
sources =
    ${core.sources}
    ${engine.sources}
    +<sim/race_trial.cpp>

[env:sim]
extends = native
build_flags =
    ${png.build_flags}
    !pkg-config --cflags --libs raylib | sed 's/-I/-isystem /g'
build_src_filter = -<*> ${trial.sources} +<sim/main.cpp> +<sim/renderer.cpp>

[env:evaluate]
extends = native
build_flags = ${png.build_flags}
build_src_filter = -<*> ${trial.sources} +<../test/evaluate_race.cpp>

[env:test-metrics]
extends = env:evaluate

[env:test-robot]
extends = native
build_src_filter = -<*> ${core.sources} +<../test/test_robot.cpp>

[env:test-route]
extends = native
build_flags = ${png.build_flags}
build_src_filter = -<*> ${core.sources} ${engine.sources} +<../test/test_route.cpp>

[env:test-trial]
extends = native
build_flags = ${png.build_flags}
build_src_filter = -<*> ${trial.sources} +<../test/test_sim_trial.cpp>

# These executables deliberately contain no controller or Drive sources.
[env:test-runtime]
extends = native
build_flags = ${png.build_flags}
build_src_filter = -<*> ${engine.sources} +<../test/test_sim_runtime.cpp>

[env:test-physics]
extends = native
build_flags = ${png.build_flags}
build_src_filter = -<*> ${engine.sources} +<../test/test_sim_physics.cpp>

# ESP32/ESP-IDF is deferred: its adapter still targets the removed core.
# ESP-IDF's internal CMake remains managed by PlatformIO, not a second frontend.
[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags = -std=gnu++17 -O3 -Wall -Wextra -I lib
build_src_filter = -<*> +<esp32/*.cpp> +<../lib/robot/*.cpp>
check_tool = cppcheck
check_src_filters = +<src/esp32/*.cpp>
check_flags = cppcheck: --enable=warning,performance,portability --inline-suppr
check_skip_packages = yes
