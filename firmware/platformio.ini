[platformio]
default_envs = sim

; --- MÔ PHỎNG 2D NATIVE (RAYLIB) TRÊN DESKTOP ---
[env:sim]
platform = native
build_flags = 
    -std=c++17
    -O3
    -Wall
    -Wextra
    -Wpedantic
    -DPLATFORM_DESKTOP
    -I lib
    -I src/sim
    -lraylib -lGL -lm -lpthread -ldl -lrt -lX11
build_src_filter = -<*> +<sim/*.cpp> +<../lib/*/*.cpp>

; --- KIỂM THỬ KHÔNG ĐỒ HỌA (HEADLESS SMOKE TEST) ---
[env:test_core]
platform = native
build_flags = 
    -std=c++17
    -O3
    -Wall
    -Wextra
    -Wpedantic
    -DPLATFORM_DESKTOP
    -I lib
build_src_filter = -<*> +<../test/test_core.cpp> +<../lib/*/*.cpp>

; --- FIRMWARE NẠP THẬT XUỐNG ESP32-S3 QUA USB ---
[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags = 
    -std=c++17
    -O3
    -DPLATFORM_ESP32
    -I lib
    -I src/esp32
build_src_filter = -<*> +<esp32/*.cpp> +<../lib/*/*.cpp>
