[platformio]
default_envs = esp32s3

[env:esp32s3]
platform = espressif32@7.1.3
board = esp32-s3-devkitc-1
framework = espidf
board_build.partitions = partitions.csv
monitor_speed = 115200
lib_ldf_mode = off
build_flags = -std=gnu++17 -I lib/robot
build_src_flags =
    -isystem $PROJECT_PACKAGES_DIR/framework-espidf/components/esp_libc/platform_include
    -isystem $PROJECT_PACKAGES_DIR/framework-espidf/components/esp_blockdev/include

[env:test]
platform = native@1.2.1
lib_ldf_mode = off
build_flags = -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror -I lib/robot -I src/esp32
build_src_filter = -<*> +<../lib/robot/*.cpp> +<../test/*.cpp>
