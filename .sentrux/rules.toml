[constraints]
min_quality = 0.70
min_acyclicity = 0.99
max_cycles = 0

# Layer order: số nhỏ = tầng trên (được phép phụ thuộc tầng dưới).
[[layers]]
name = "sim"
order = 1
paths = ["firmware/src/sim/**"]

[[layers]]
name = "esp32"
order = 1
paths = ["firmware/src/esp32/**"]

[[layers]]
name = "kernel"
order = 2
paths = ["firmware/lib/kernel/**"]

[[layers]]
name = "layout"
order = 3
paths = ["firmware/lib/layout/**"]
