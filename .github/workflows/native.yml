name: Firmware checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ clang-format clang-tidy python3-venv
          python3 -m venv /tmp/platformio
          /tmp/platformio/bin/pip install platformio
          echo /tmp/platformio/bin >> "$GITHUB_PATH"
      # Host contract tests and cross-compile only; no hardware verification.
      - run: just check
      - run: just sanitize
